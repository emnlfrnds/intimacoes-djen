services:
  postgres:
    image: postgres:16-alpine
    container_name: djen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - djen-pgdata:/var/lib/postgresql/data

volumes:
  djen-pgdata: